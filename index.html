<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b48"><meta name="description" content="Private offline-first personal workout tracker">
<link rel="manifest" href="manifest.webmanifest"><title>MY GYM</title>
<style>
:root{color-scheme:light;--bg:#f7faf8;--paper:#fff;--ink:#17251e;--muted:#748279;--green:#176b48;--green2:#e8f3ec;--line:#e5ece7;--gold:#b08a4a;--shadow:0 10px 28px rgba(22,61,40,.08);--shadow2:0 4px 12px rgba(22,61,40,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8ac5a4;outline-offset:2px}.app{max-width:780px;margin:auto;padding:14px 16px calc(104px + env(safe-area-inset-bottom))}header{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.08em;font-size:19px}.brand span{color:var(--green)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.muted{color:var(--muted)}.tiny{font-size:12px}.h1{font-size:28px;letter-spacing:-.04em;line-height:1.1;margin:8px 0}.h2{font-size:18px;margin:0 0 12px;letter-spacing:-.02em}.card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:16px;margin:12px 0;box-shadow:var(--shadow2);animation:rise .35s ease both}.hero{padding:21px;border-radius:24px;background:linear-gradient(135deg,#155b3d,#218357);color:#fff;box-shadow:0 14px 32px rgba(23,107,72,.2);margin:15px 0}.hero .muted{color:#d7eadf}.hero h1{font-size:28px;margin:7px 0}.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--green);color:#fff;font-weight:750;box-shadow:0 5px 12px #176b4824}.btn:active{transform:scale(.98)}.btn.soft{background:var(--green2);color:var(--green);box-shadow:none}.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.gold{background:#f5efe4;color:#775c2d;box-shadow:none}.btn.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:var(--shadow2)}.stat b{display:block;font-size:24px;letter-spacing:-.04em}.pill{border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;background:var(--green2);color:var(--green)}.dayrow,.exercise-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.dayrow:last-child,.exercise-row:last-child{border:0}.dayicon{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--green2);display:grid;place-items:center;color:var(--green);font-weight:850}.grow{flex:1;min-width:0}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.93);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.tabs button{flex:1;max-width:150px;border:0;border-radius:13px;background:transparent;color:var(--muted);padding:7px 2px;font-size:11px;font-weight:650}.tabs button.active{background:var(--green2);color:var(--green)}.tabs .ico{font-size:18px;line-height:1.2;display:block;margin-bottom:2px}.field{width:100%;border:1px solid var(--line);border-radius:12px;background:#fbfdfb;padding:11px;color:var(--ink);min-width:0}.label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:9px 0 5px}.set-head,.setrow{display:grid;grid-template-columns:44px 1fr 1fr 36px;gap:7px;align-items:center}.set-head{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em;padding:7px 0}.setrow{margin:7px 0}.setrow input{width:100%;min-width:0;text-align:center;padding:10px 5px;border:1px solid var(--line);border-radius:10px;background:#fbfdfb}.check{width:23px;height:23px;accent-color:var(--green);justify-self:center}.progress{height:8px;border-radius:99px;background:#eaf0eb;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#176b48,#49a878);border-radius:99px;transition:width .4s ease}.timer-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:12px auto;background:conic-gradient(var(--green) var(--pct,0%),#e8efe9 0);position:relative}.timer-ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:white}.timer-ring strong{position:relative;font-size:34px;letter-spacing:-.04em}.empty{padding:24px;text-align:center;color:var(--muted)}.chart{height:155px;display:flex;align-items:end;gap:8px;padding:12px 4px 0;border-bottom:1px solid var(--line)}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px}.bar{width:min(28px,75%);min-height:3px;background:linear-gradient(180deg,#48a978,#176b48);border-radius:8px 8px 3px 3px;transition:height .45s ease}.barlabel{font-size:10px;color:var(--muted)}.modal{position:fixed;inset:0;background:#102219a8;z-index:20;display:grid;place-items:center;padding:20px}.modalbox{width:min(420px,100%);background:#fff;border-radius:25px;padding:24px;box-shadow:0 25px 80px #0003;animation:rise .3s ease}.modal.hidden{display:none}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#173d2a;color:white;border-radius:99px;padding:10px 16px;font-size:13px;z-index:30;box-shadow:var(--shadow);animation:rise .2s ease}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:14px 0}.small-actions{display:flex;gap:7px;flex-wrap:wrap}.goldline{height:2px;width:35px;background:var(--gold);border-radius:9px;margin:8px 0 13px}.notice{background:#f4f8f5;border:1px solid #e3eee6;padding:12px;border-radius:14px;color:#526b5b;font-size:12px}.danger{color:#a13f39}.exercise-title{font-weight:800;letter-spacing:-.01em}.animate{animation:rise .28s ease both}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(min-width:620px){.app{padding-top:24px}.grid.stats{grid-template-columns:repeat(4,1fr)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="modal" id="lock"><div class="modalbox"><div class="brand">MY <span>GYM</span></div><div class="goldline"></div><div class="eyebrow">Your private training space</div><h1 class="h1" id="lockTitle">Create your PIN</h1><p class="muted" id="lockText">Set a 4–12 digit PIN. Your workout data will be encrypted on this device.</p><input class="field" id="pinInput" type="password" inputmode="numeric" maxlength="12" autocomplete="current-password" placeholder="Enter PIN"><button class="btn full" id="pinButton" style="margin-top:12px">Create secure space</button><p class="tiny muted" id="pinHint">Keep your PIN safe. It cannot be recovered if you forget it.</p></div></div>
<div class="app" id="app"><header><div class="brand">MY <span>GYM</span></div><span class="pill">PRIVATE EDITION</span></header><main id="view"></main></div>
<nav class="tabs hidden" id="tabs"><button data-tab="home" class="active"><span class="ico">⌂</span>Home</button><button data-tab="split"><span class="ico">▦</span>Split</button><button data-tab="workout"><span class="ico">✚</span>Workout</button><button data-tab="progress"><span class="ico">▥</span>Progress</button><button data-tab="settings"><span class="ico">⚙</span>Settings</button></nav><div id="toast" class="toast hidden"></div>
<script>
const PLAN=[
{day:'Monday',name:'Chest',exercises:['Dumbbell Press – Incline','Dumbbell Press – Decline','Dumbbell Press – Flat','Double Fly','Pec Deck Fly','Cable Fly']},
{day:'Tuesday',name:'Back',exercises:['Lat Pulldown','V-Bar Seated Row','Chest Supported Row','T-Bar Row','Double Row','Single Arm Row','Reverse Pec Deck Fly','Dumbbell Row']},
{day:'Wednesday',name:'Triceps',exercises:['Close Grip Bench Press','Single Arm Overhead Extension','Both Arm Overhead Extension','Overhead Triceps Pushdown','V-Bar Pushdown','Z-Bar Overhead Extension']},
{day:'Thursday',name:'Biceps',exercises:['Barbell Curl','Dumbbell Curl','Hammer Curl','Preacher Curl','Cable Curl – Upward Pull','Concentration Curl']},
{day:'Friday',name:'Shoulders',exercises:['Barbell Press','Dumbbell Press','Dumbbell Lateral Raise','Front Raise','Rear Delt Cable Pull – Face Pull','Reverse Pec Deck Fly']},
{day:'Saturday',name:'Legs',exercises:['Smith Machine Squat','Leg Raises','Reverse Leg Raises','Leg Press','Seated Toe Raise']},
{day:'Sunday',name:'Rest',exercises:[]}
];
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='mygym_private_v1';const enc=new TextEncoder(),dec=new TextDecoder();let cryptoKey=null,db=null,tab='home',activeDay=0,timer=null,remaining=60;
const fresh=()=>({plan:PLAN.map(d=>({...d,exercises:d.exercises.map(name=>({name,sets:[1,2,3].map(()=>({weight:'',reps:12,done:false}))}))})),logs:[],settings:{unit:'kg',rest:60},lastWeights:{}});
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(pin,salt){let material=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function persist(){let iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,enc.encode(JSON.stringify(db)));localStorage.setItem(STORE,JSON.stringify({salt:window.salt64,iv:b64(iv),cipher:b64(cipher),version:1}));}
async function unlock(pin,isNew){try{if(isNew){let salt=crypto.getRandomValues(new Uint8Array(16));window.salt64=b64(salt);cryptoKey=await derive(pin,salt);db=fresh();await persist()}else{let saved=JSON.parse(localStorage.getItem(STORE));window.salt64=saved.salt;cryptoKey=await derive(pin,unb64(saved.salt));let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(saved.iv)},cryptoKey,unb64(saved.cipher));db=JSON.parse(dec.decode(plain));}$('#lock').classList.add('hidden');$('#tabs').classList.remove('hidden');render();}catch(e){$('#pinHint').textContent='PIN did not unlock this data. Try again. If you forgot your PIN, only a backup can help.';}}
$('#pinButton').onclick=()=>{let p=$('#pinInput').value;if(!/^\d{4,12}$/.test(p)){ $('#pinHint').textContent='PIN must contain 4–12 digits.';return;}let exists=localStorage.getItem(STORE);unlock(p,!exists)};$('#pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#pinButton').click()});if(localStorage.getItem(STORE)){let o=JSON.parse(localStorage.getItem(STORE));if(o.iv){$('#lockTitle').textContent='Welcome back';$('#lockText').textContent='Enter your PIN to unlock your private workout tracker.';$('#pinButton').textContent='Unlock MY GYM';}}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2200)}
function save(){persist().catch(()=>toast('Could not save. Check device storage.'))}
function setsCount(){return db.plan.reduce((n,d)=>n+d.exercises.reduce((m,e)=>m+e.sets.length,0),0)}function doneCount(){return db.plan.reduce((n,d)=>n+d.exercises.reduce((m,e)=>m+e.sets.filter(s=>s.done).length,0),0)}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let v=$('#view');v.innerHTML=tab==='home'?home():tab==='split'?split():tab==='workout'?workout():tab==='progress'?progress():settings();window.scrollTo({top:0,behavior:'smooth'});}
$('#tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};
function home(){let ix=(new Date().getDay()+6)%7,d=db.plan[ix],planned=setsCount(),checked=doneCount();return `<div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1 class="h1">Train with intention.</h1><p class="muted">Your training. Your pace. Your progress.</p><section class="hero"><div class="eyebrow" style="color:#d7eadf">Today's plan</div><h1>${esc(d.name)} ${d.name==='Rest'?'Day':'Day'}</h1><p class="muted">${d.exercises.length?d.exercises.length+' exercises · '+d.exercises.reduce((n,e)=>n+e.sets.length,0)+' planned sets':'Recovery day. Rest well.'}</p><button class="btn" style="background:#fff;color:var(--green);margin-top:6px" onclick="activeDay=${ix};tab='workout';render()">${d.name==='Rest'?'View rest day':'Open workout'} →</button></section><div class="grid stats"><div class="stat"><b>6</b><span class="tiny muted">Training days</span></div><div class="stat"><b>${db.logs.length}</b><span class="tiny muted">Saved sessions</span></div><div class="stat"><b>${planned}</b><span class="tiny muted">Planned sets/week</span></div><div class="stat"><b>${checked}</b><span class="tiny muted">Checked sets</span></div></div><section class="card"><div class="row"><h2 class="h2">Your weekly split</h2><span class="pill">6 + 1</span></div>${db.plan.map((x,i)=>`<div class="dayrow"><div class="dayicon">${i===6?'休':i+1}</div><div class="grow"><b>${esc(x.name)}</b><div class="tiny muted">${x.day} · ${x.exercises.length} exercises</div></div><button class="btn soft" onclick="activeDay=${i};tab='workout';render()">Open</button></div>`).join('')}</section><section class="card"><div class="row"><h2 class="h2">Recent activity</h2><button class="btn line" onclick="tab='progress';render()">View all</button></div>${db.logs.slice(0,2).map(l=>`<div class="dayrow"><div class="dayicon">✓</div><div class="grow"><b>${esc(l.name)} day</b><div class="tiny muted">${new Date(l.date).toLocaleDateString()} · ${l.done}/${l.total} sets</div></div></div>`).join('')||'<div class="empty">Your completed sessions will appear here.</div>'}</section>`}
function split(){return `<div class="eyebrow">Your custom schedule</div><h1 class="h1">My split</h1><p class="muted">Your six training days and Sunday recovery.</p>${db.plan.map((d,i)=>`<section class="card"><div class="row"><div><div class="eyebrow">${d.day}</div><h2 class="h2" style="margin:3px 0">${esc(d.name)} day</h2><span class="tiny muted">${d.exercises.length} exercises · ${d.exercises.reduce((n,e)=>n+e.sets.length,0)} sets</span></div><button class="btn soft" onclick="activeDay=${i};tab='workout';render()">Manage</button></div>${d.exercises.map((e,j)=>`<div class="exercise-row"><div class="dayicon">${j+1}</div><div class="grow"><b>${esc(e.name)}</b><div class="tiny muted">${e.sets.length} sets · ${e.sets[0]?.reps??12} reps default</div></div></div>`).join('')||'<p class="muted tiny">Rest and recovery</p>'}</section>`).join('')}`}
function workout(){let d=db.plan[activeDay];return `<div class="row"><div><div class="eyebrow">Workout session · ${d.day}</div><h1 class="h1">${esc(d.name)} day</h1></div><span class="pill">${d.exercises.length} exercises</span></div><select class="field" id="daySelect">${db.plan.map((x,i)=>`<option value="${i}" ${i===activeDay?'selected':''}>${x.day} · ${x.name}</option>`).join('')}</select>${d.exercises.length?d.exercises.map((e,j)=>`<section class="card"><div class="row"><div class="grow"><div class="eyebrow">Exercise ${j+1}</div><h2 class="h2" style="margin:3px 0">${esc(e.name)}</h2></div><button class="btn line" onclick="editExercise(${activeDay},${j})">Edit</button></div><div class="set-head"><span>SET</span><span>WEIGHT (${db.settings.unit})</span><span>REPS</span><span>DONE</span></div>${e.sets.map((s,k)=>`<div class="setrow"><b>${k+1}</b><input type="number" min="0" step="0.5" placeholder="—" value="${esc(s.weight)}" aria-label="Set ${k+1} weight" onchange="setValue(${j},${k},'weight',this.value)"><input type="number" min="0" step="1" value="${s.reps}" aria-label="Set ${k+1} reps" onchange="setValue(${j},${k},'reps',this.value)"><input class="check" type="checkbox" ${s.done?'checked':''} aria-label="Set ${k+1} complete" onchange="setValue(${j},${k},'done',this.checked)"></div>`).join('')}<div class="small-actions" style="margin-top:12px"><button class="btn soft" onclick="addSet(${j})">+ Add set</button><button class="btn line" onclick="removeSet(${j})">− Remove last</button></div></section>`).join(''):`<section class="card empty"><div style="font-size:30px">☕</div><h2 class="h2">Rest day</h2>Nothing scheduled. Recovery is part of training.</section>`}<section class="card"><div class="row"><div><div class="eyebrow">Rest interval</div><h2 class="h2" style="margin:3px 0">Between sets</h2></div><span class="pill">${db.settings.rest}s default</span></div><div class="timer-ring" id="timerRing" style="--pct:0%"><strong id="timerText">${formatTime(db.settings.rest)}</strong></div><div class="small-actions" style="justify-content:center"><button class="btn" onclick="startTimer()">Start timer</button><button class="btn line" onclick="resetTimer()">Reset</button><button class="btn line" onclick="skipTimer()">Skip</button></div></section><button class="btn full" onclick="finishWorkout()">Save workout session</button>`}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function setValue(ei,si,field,val){let e=db.plan[activeDay].exercises[ei],s=e.sets[si];s[field]=field==='reps'?Math.max(0,Number(val)||0):field==='done'?val:val;if(field==='weight'&&val!==''){db.lastWeights[e.name]=val;e.sets.forEach((x,k)=>{if(k!==si&&x.weight==='')x.weight=val})}save();if(field==='done'&&val){toast('Set completed ✓');let r=document.querySelector('.progress i');}}
function addSet(ei){let e=db.plan[activeDay].exercises[ei],last=e.sets[e.sets.length-1];e.sets.push({weight:last?.weight||db.lastWeights[e.name]||'',reps:last?.reps??12,done:false});save();render()}
function removeSet(ei){let e=db.plan[activeDay].exercises[ei];if(e.sets.length<=1){toast('Keep at least one set.');return}e.sets.pop();save();render()}
function editExercise(di,ei){let e=db.plan[di].exercises[ei],name=prompt('Exercise name',e.name);if(name===null)return;if(name.trim()){let old=e.name;e.name=name.trim();if(db.lastWeights[old]&&!db.lastWeights[e.name])db.lastWeights[e.name]=db.lastWeights[old]}let count=prompt('Number of sets (1–20)',String(e.sets.length));if(count!==null){let n=Math.max(1,Math.min(20,parseInt(count)||1));while(e.sets.length<n)e.sets.push({weight:db.lastWeights[e.name]||'',reps:12,done:false});e.sets=e.sets.slice(0,n)}save();render()}
function startTimer(){clearInterval(timer);remaining=db.settings.rest;tickTimer();timer=setInterval(()=>{remaining--;tickTimer();if(remaining<=0){clearInterval(timer);timer=null;toast('Rest complete');if(navigator.vibrate)navigator.vibrate([120,70,120])}},1000)}function tickTimer(){let t=$('#timerText'),r=$('#timerRing');if(t)t.textContent=formatTime(remaining);if(r)r.style.setProperty('--pct',`${100*(db.settings.rest-remaining)/db.settings.rest}%`)}function resetTimer(){clearInterval(timer);timer=null;remaining=db.settings.rest;tickTimer()}function skipTimer(){clearInterval(timer);timer=null;remaining=0;tickTimer()}
function finishWorkout(){let d=db.plan[activeDay];if(!d.exercises.length){toast('Rest day — no session to save.');return}let done=d.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0),total=d.exercises.reduce((n,e)=>n+e.sets.length,0);db.logs.unshift({date:new Date().toISOString(),day:d.day,name:d.name,done,total,exercises:d.exercises.map(e=>({name:e.name,sets:e.sets.map(s=>({...s}))}))});d.exercises.forEach(e=>e.sets.forEach(s=>s.done=false));save();toast(`Session saved · ${done}/${total} sets checked`);tab='progress';render()}
function progress(){let sessions=db.logs.length,done=db.logs.reduce((n,l)=>n+l.done,0),total=db.logs.reduce((n,l)=>n+l.total,0),recent=db.logs.slice(0,7).reverse(),max=Math.max(1,...recent.map(x=>x.done));return `<div class="eyebrow">Consistency over time</div><h1 class="h1">Your progress</h1><p class="muted">A clear record of the work you put in.</p><div class="grid stats"><div class="stat"><b>${sessions}</b><span class="tiny muted">Sessions saved</span></div><div class="stat"><b>${done}</b><span class="tiny muted">Sets completed</span></div><div class="stat"><b>${total}</b><span class="tiny muted">Sets logged</span></div><div class="stat"><b>${db.plan.slice(0,6).length}</b><span class="tiny muted">Training days</span></div></div><section class="card"><h2 class="h2">Recent completed sets</h2>${recent.length?`<div class="chart">${recent.map(l=>`<div class="barwrap"><div class="bar" style="height:${Math.max(3,100*l.done/max)}%" title="${l.done} sets"></div><span class="barlabel">${new Date(l.date).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span></div>`).join('')}</div><p class="tiny muted">Completed sets per saved session · latest ${recent.length}</p>`:'<div class="empty">Your chart will appear after you save your first workout.</div>'}</section><section class="card"><h2 class="h2">Workout history</h2>${db.logs.length?db.logs.map(l=>`<div class="dayrow"><div class="dayicon">✓</div><div class="grow"><b>${esc(l.name)} day</b><div class="tiny muted">${new Date(l.date).toLocaleString()} · ${l.done}/${l.total} sets checked</div></div></div>`).join(''):'<div class="empty">No sessions saved yet.</div>'}</section>`}
function settings(){return `<div class="eyebrow">Personalize your tracker</div><h1 class="h1">Settings</h1><section class="card"><h2 class="h2">Workout preferences</h2><label class="label" for="unit">Weight unit</label><select class="field" id="unit"><option value="kg" ${db.settings.unit==='kg'?'selected':''}>Kilograms (kg)</option><option value="lbs" ${db.settings.unit==='lbs'?'selected':''}>Pounds (lbs)</option></select><label class="label" for="restInput">Default rest timer (seconds)</label><input class="field" id="restInput" type="number" min="1" max="3600" value="${db.settings.rest}"><button class="btn full" style="margin-top:12px" onclick="savePrefs()">Save preferences</button></section><section class="card"><h2 class="h2">Privacy & data</h2><p class="tiny muted">Workout data is encrypted locally with AES-GCM. Your PIN is used to derive the encryption key and is not saved.</p><button class="btn soft full" onclick="exportBackup()">Export encrypted backup</button><label class="btn line full" style="display:block;text-align:center;margin-top:8px">Import encrypted backup<input type="file" accept="application/json" hidden onchange="importBackup(this)"></label><button class="btn line full" style="margin-top:8px" onclick="changePin()">Change PIN</button><button class="btn line full" style="margin-top:8px" onclick="lockNow()">Lock app now</button></section><div class="notice">Important: use your device screen lock too. Export backups regularly and keep the backup file and PIN separately. Clearing browser data can erase your local copy.</div><p class="tiny muted" style="text-align:center;margin-top:18px">MY GYM · Personal Edition</p>`}
function savePrefs(){db.settings.unit=$('#unit').value;db.settings.rest=Math.max(1,Math.min(3600,Number($('#restInput').value)||60));save();toast('Preferences saved')}
function exportBackup(){let a=document.createElement('a'),blob=new Blob([localStorage.getItem(STORE)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='my-gym-encrypted-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Encrypted backup exported')}
async function importBackup(input){let f=input.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!o.salt||!o.iv||!o.cipher)throw Error();localStorage.setItem(STORE,JSON.stringify(o));alert('Backup imported. The app will reload. Unlock using the PIN that was active when this backup was created.');location.reload()}catch(e){alert('This does not look like a valid MY GYM backup.')}}
async function changePin(){let old=prompt('Enter current PIN');if(!old)return;try{let saved=JSON.parse(localStorage.getItem(STORE)),oldKey=await derive(old,unb64(saved.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(saved.iv)},oldKey,unb64(saved.cipher));let next=prompt('Enter a new 4–12 digit PIN');if(!/^\d{4,12}$/.test(next||'')){toast('PIN must be 4–12 digits');return}let salt=crypto.getRandomValues(new Uint8Array(16));window.salt64=b64(salt);cryptoKey=await derive(next,salt);db=JSON.parse(dec.decode(plain));await persist();toast('PIN changed successfully')}catch(e){toast('Current PIN is incorrect')}}
function lockNow(){clearInterval(timer);location.reload()}
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
